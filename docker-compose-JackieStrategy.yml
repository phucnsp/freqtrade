---
services:
  webhook:
    build:
      context: ./user_data/webhook_server
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: webhook_server
    ports:
      - "8083:8083"
    volumes:
      - ./user_data/webhook_server:/app      # mount code in at runtime
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET=${BINANCE_SECRET}
      - BINANCE_SANDBOX=${BINANCE_SANDBOX}
      - BOT_CAPITAL_BALANCE=${BOT_CAPITAL_BALANCE}
      - PROFIT_MIN_THRESHOLD=${PROFIT_MIN_THRESHOLD}
    command: uvicorn webhook_server:app --host 0.0.0.0 --port 8083 --reload

  freqtradeDCA:
    image: freqtradeorg/freqtrade:stable
    # image: freqtradeorg/freqtrade:develop
    # Use plotting image
    # image: freqtradeorg/freqtrade:develop_plot
    # # Enable GPU Image and GPU Resources (only relevant for freqAI)
    # # Make sure to uncomment the whole deploy section
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Build step - only needed when additional dependencies are needed
    # build:
    #   context: .
    #   dockerfile: "./docker/Dockerfile.custom"
    restart: unless-stopped
    container_name: freqtradeDCA
    volumes:
      - "./user_data:/freqtrade/user_data"
    # Expose api on port 8080 (localhost only)
    # Please read the https://www.freqtrade.io/en/stable/rest-api/ documentation
    # for more information.
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - webhook
    # Default command used when running `docker compose up`
    command: >
      trade
      --logfile /freqtrade/user_data/logs/JackieStrategyDCA.log
      --config /freqtrade/user_data/strategies/config_live_JackieStrategyDCA.json
      --strategy JackieStrategyDCA

  freqtradeManual:
    image: freqtradeorg/freqtrade:stable
    # image: freqtradeorg/freqtrade:develop
    # Use plotting image
    # image: freqtradeorg/freqtrade:develop_plot
    # # Enable GPU Image and GPU Resources (only relevant for freqAI)
    # # Make sure to uncomment the whole deploy section
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Build step - only needed when additional dependencies are needed
    # build:
    #   context: .
    #   dockerfile: "./docker/Dockerfile.custom"
    restart: unless-stopped
    container_name: freqtradeManual
    volumes:
      - "./user_data:/freqtrade/user_data"
    # Expose api on port 8080 (localhost only)
    # Please read the https://www.freqtrade.io/en/stable/rest-api/ documentation
    # for more information.
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      - webhook
    # Default command used when running `docker compose up`
    command: >
      trade
      --logfile /freqtrade/user_data/logs/JackieStrategyManual.log
      --config /freqtrade/user_data/strategies/config_live_JackieStrategyManual.json
      --strategy JackieStrategyManual
